<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Callista's Bakery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Elegant font for brand -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navbar (from Assignment 6 integration) -->
<nav class="navbar navbar-expand-lg navbar-dark shadow-sm" style="background: linear-gradient(90deg, var(--pink), var(--lav));">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html" style="font-family: 'Great Vibes', cursive; font-size: 1.8rem;">
      Callista's Bakery ❤️
    </a>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
      </ul>
      <div class="d-flex ms-3">
        <a href="login.html" class="btn btn-outline-light me-2">Login</a>
        <a href="registration.html" class="btn btn-gradient">Register</a>
      </div>
    </div>
  </div>
</nav>

<!-- Register Form -->
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <h2 class="mb-4 text-center">📝 Register at Callista's Bakery</h2>
      <form id="registerForm" class="p-4 bg-white rounded shadow-sm">
        <!-- Full Name -->
        <div class="mb-3">
          <label for="name" class="form-label">Full Name</label>
          <input type="text" id="name" class="form-control" required>
        </div>
        <!-- Email -->
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" class="form-control" required>
        </div>
        <!-- Password -->
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="form-control" minlength="6" required>
        </div>
        <!-- Gender -->
        <div class="mb-3">
          <label class="form-label">Gender</label><br>
          <input type="radio" name="gender" value="Male"> Male
          <input type="radio" name="gender" value="Female"> Female
          <input type="radio" name="gender" value="Other"> Other
        </div>
        <!-- Date of Birth -->
        <div class="mb-3">
          <label for="dob" class="form-label">Date of Birth</label>
          <input type="date" id="dob" class="form-control">
        </div>
        <!-- Favorite Product Dropdown -->
        <div class="mb-3">
          <label for="favorite" class="form-label">Favorite Product</label>
          <select id="favorite" class="form-control">
            <option>Banana Bread</option>
            <option>Chocolate Cake</option>
            <option>Croissants</option>
            <option>Blueberry Muffins</option>
            <option>Blueberry Pie</option>
          </select>
        </div>
        <!-- Newsletter Checkbox -->
        <div class="mb-3">
          <input type="checkbox" id="newsletter"> 
          <label for="newsletter">Subscribe to our newsletter</label>
        </div>
        <!-- Address -->
        <div class="mb-3">
          <label for="address" class="form-label">Address</label>
          <textarea id="address" rows="3" class="form-control"></textarea>
        </div>
        <!-- Submit -->
        <button type="submit" class="btn btn-gradient w-100">Register</button>
      </form>
      <p class="mt-3 text-center">Already have an account? <a href="login.html">Login here</a></p>
    </div>
  </div>
</div>

<!-- Footer -->
<footer class="text-white py-3 mt-5" style="background: linear-gradient(90deg, var(--pink), var(--lav));">
  <div class="container text-center">
    <small>&copy; 2025 Callista's Bakery | (+977) 9841347856 | hello@callistasbakery.com</small>
  </div>
</footer>

<script>
  document.getElementById("registerForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const user = {
      name: document.getElementById("name").value,
      email: document.getElementById("email").value,
      password: document.getElementById("password").value
    };
    localStorage.setItem("user", JSON.stringify(user)); // Mock DB
    alert("🎉 Registration Successful! Please login.");
    window.location.href = "login.html";
  });
</script>
</body>
</html>
