<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Callista's Bakery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Elegant font for brand -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark shadow-sm" style="background: linear-gradient(90deg, var(--pink), var(--lav));">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html" style="font-family: 'Great Vibes', cursive; font-size: 1.8rem;">
      Callista's Bakery ❤️
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
      </ul>
      <!-- Login/Register buttons -->
      <div class="d-flex ms-3">
        <a href="login.html" class="btn btn-outline-light me-2 login-btn">Login</a>
        <a href="registration.html" class="btn btn-gradient register-btn">Register</a>
      </div>
    </div>
  </div>
</nav>

<!-- Login Form Section -->
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <h2 class="mb-4 text-center">🔑 Login to Callista's Bakery</h2>
      <form id="loginForm" class="p-4 bg-white rounded shadow-sm">
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-gradient w-100">Login</button>
      </form>
      <p class="mt-3 text-center">Don't have an account? <a href="registration.html">Register here</a></p>
    </div>
  </div>
</div>

<!-- Footer -->
<footer class="text-white py-3 mt-5" style="background: linear-gradient(90deg, var(--pink), var(--lav));">
  <div class="container text-center">
    <small>&copy; 2024 Callista's Bakery | (+977) 9841347856 | hello@callistasbakery.com</small>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- ✅ Firebase Login Script -->
<script type="module">
  // Import Firebase SDK
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";

  // 🔹 Your Firebase config
  const firebaseConfig = {
    apiKey: "AIzaSyDIHwp3cyGch16S_WSv8UrUT7PJTJ21pi8",
    authDomain: "christina-448f2.firebaseapp.com",
    databaseURL: "https://christina-448f2-default-rtdb.firebaseio.com",
    projectId: "christina-448f2",
    storageBucket: "christina-448f2.firebasestorage.app",
    messagingSenderId: "640057777362",
    appId: "1:640057777362:web:f50e7ced6264a777a6e10b",
    measurementId: "G-MW49LFK62Y"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // Handle login with Firebase Auth
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {
      const userCredential = await signInWithEmailAndPassword(auth, email, password);
      const user = userCredential.user;

      alert(`🎉 Welcome back, ${user.email}!`);
      window.location.href = "index.html"; // redirect after login
    } catch (error) {
      alert("❌ " + error.message);
    }
  });
</script>

</body>
</html>
