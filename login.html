<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Callista's Bakery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container my-5">
    <h2 class="mb-4">🔑 Login to Callista's Bakery</h2>
    <form id="loginForm" class="p-4 bg-white rounded shadow-sm">
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-success">Login</button>
    </form>
    <p class="mt-3">Don't have an account? <a href="registration.html">Register here</a></p>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      // Get user data from localStorage
      const storedUser = JSON.parse(localStorage.getItem("user"));

      if (!storedUser) {
        alert("⚠️ No user found. Please register first.");
        window.location.href = "registration.html";
        return;
      }

      // Validate login
      if (email === storedUser.email && password === storedUser.password) {
        alert(`🎉 Welcome back, ${storedUser.name}!`);
        localStorage.setItem("isLoggedIn", "true");
        window.location.href = "index.html"; // Redirect to homepage
      } else {
        alert("❌ Invalid email or password. Please try again.");
      }
    });
  </script>
</body>
</html>
